name: Build and Publish Docker Images to GHCR

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push Images to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Owner Name
        id: repo-owner
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -------------------------------------------------------------
      # 1. Construir y Publicar Imagen del Backend
      # -------------------------------------------------------------
      - name: Build and push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo-owner.outputs.owner }}/openblind-backend:latest
            ghcr.io/${{ steps.repo-owner.outputs.owner }}/openblind-backend:${{ github.sha }}

      # -------------------------------------------------------------
      # 2. Construir y Publicar Imagen del Frontend
      # -------------------------------------------------------------
      - name: Build and push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:3000
          tags: |
            ghcr.io/${{ steps.repo-owner.outputs.owner }}/openblind-frontend:latest
            ghcr.io/${{ steps.repo-owner.outputs.owner }}/openblind-frontend:${{ github.sha }}
